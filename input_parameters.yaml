# Input and configuration parameters for sod's shock tube solver

geometry:
  L: 1            # Length of the tube
  d_x: 0.5        # Location of discontinuity
  n_x: 100        # Number of cells

left_state: 
  rho: 1
  P: 1

right_state: 
  rho: 1
  P: 1

gamma: 1.4        # specific heat ratio of the fluid
u_0: 0            # initial velocity of the flowfield
t_f: 0.2          # final time
CFL: 0.5          # CFL condition value
